# CI/CD de la aplicacion (Opcion A).
#   Pull Request a main : lint + docker build + escaneo. No publica ni despliega nada.
#   Push a main         : lo anterior + push a ECR + despliegue en ECS + smoke test
#                         + ROLLBACK automatico a la revision anterior si algo falla.
name: Joomla app - CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "joomla-cicd-obs/app/**"
      - "joomla-cicd-obs/scripts/**"
      - ".github/workflows/joomla-app-cicd.yml"
  push:
    branches: [main]
    paths:
      - "joomla-cicd-obs/app/**"
      - "joomla-cicd-obs/scripts/**"
      - ".github/workflows/joomla-app-cicd.yml"
  workflow_dispatch: # redesplegar a mano (por ejemplo, tras un cambio de infraestructura)

permissions:
  id-token: write
  contents: read

concurrency:
  group: joomla-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: joomla-cicd-obs/app/Dockerfile
          failure-threshold: error

      - name: shellcheck (scripts)
        run: shellcheck joomla-cicd-obs/app/itm-start.sh joomla-cicd-obs/scripts/smoke-test.sh

      - name: Sintaxis de PHP propio
        run: |
          set -euo pipefail
          find joomla-cicd-obs/app/custom -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: joomla-cicd-obs/app
          load: true
          push: false
          tags: joomla-itm:ci
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: trivy sobre la imagen (informativo, no bloquea)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --severity CRITICAL --ignore-unfixed --exit-code 0 joomla-itm:ci

  deploy:
    name: push a ECR, deploy a ECS, smoke test y rollback
    needs: ci
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Credenciales de AWS (rol de la aplicacion)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APP_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Variables del despliegue
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${SHORT_SHA}"
            echo "CLUSTER=${PROJECT_NAME}-cluster"
            echo "SERVICE=${PROJECT_NAME}-service"
            echo "FAMILY=${PROJECT_NAME}-joomla"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Comprobar que la infraestructura existe
        run: |
          STATUS=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" \
                     --query 'services[0].status' --output text 2>/dev/null || true)
          if [ "${STATUS}" != "ACTIVE" ]; then
            echo "::error::El servicio ${SERVICE} no esta ACTIVE. Aplica primero la infraestructura (workflow 'Joomla infra - apply')."
            exit 1
          fi

      - name: ¿La imagen ya existe en ECR?
        id: exists
        run: |
          # Las etiquetas de ECR son inmutables: si el SHA ya se publico, se reutiliza la imagen
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="${SHORT_SHA}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build y push a ECR
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: joomla-cicd-obs/app
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BUILD_SHA=${{ env.SHORT_SHA }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar la nueva revision de la tarea y desplegar
        run: |
          set -euo pipefail
          PREVIOUS_TD=$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" \
                          --query 'services[0].taskDefinition' --output text)
          echo "PREVIOUS_TD=${PREVIOUS_TD}" >> "$GITHUB_ENV"
          echo "Revision en ejecucion antes del despliegue: ${PREVIOUS_TD}"

          # Ultima revision de la familia, con la imagen cambiada por la recien publicada
          NEW_DEF=$(aws ecs describe-task-definition --task-definition "${FAMILY}" --query taskDefinition \
            | jq --arg IMG "${IMAGE}" '
                del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy, .deregisteredAt)
                | .containerDefinitions |= map(if .name == "joomla" then .image = $IMG else . end)')
          NEW_TD=$(aws ecs register-task-definition --cli-input-json "${NEW_DEF}" \
                     --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "NEW_TD=${NEW_TD}" >> "$GITHUB_ENV"
          echo "Nueva revision: ${NEW_TD}"

          aws ecs update-service --cluster "${CLUSTER}" --service "${SERVICE}" \
            --task-definition "${NEW_TD}" >/dev/null
          echo "Esperando a que el servicio se estabilice..."
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"

      - name: Smoke test
        run: |
          set -euo pipefail
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "${PROJECT_NAME}-alb" \
                      --query 'LoadBalancers[0].DNSName' --output text)
          echo "ALB_DNS=${ALB_DNS}" >> "$GITHUB_ENV"
          bash joomla-cicd-obs/scripts/smoke-test.sh "http://${ALB_DNS}" "${SHORT_SHA}"

      - name: Rollback a la revision anterior
        if: ${{ failure() && env.PREVIOUS_TD != '' }}
        run: |
          echo "::warning::El despliegue fallo. Volviendo a ${PREVIOUS_TD}"
          aws ecs update-service --cluster "${CLUSTER}" --service "${SERVICE}" \
            --task-definition "${PREVIOUS_TD}" >/dev/null
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"
          echo "Rollback completado; el workflow termina en error para dejar constancia del fallo."

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue de la aplicacion"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Imagen | \`${IMAGE}\` |"
            echo "| Revision anterior | \`${PREVIOUS_TD:-n/a}\` |"
            echo "| Revision nueva | \`${NEW_TD:-n/a}\` |"
            echo "| Sitio | http://${ALB_DNS:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
